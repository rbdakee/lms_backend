# Каталог картинок для презентации: данные, а не код (по образцу games/catalog).
# Добавить или убрать картинку — строка здесь и файл в files/; код читает каталог
# при старте и ничего о конкретных картинках не знает.
#
# key        — то, что пишет в слайд модель (латиница, строчные, `_`)
# file       — PNG в files/ (192x192, прозрачный фон)
# src        — эмодзи Fluent, из которого сделан файл (атрибуция)
# category   — раздел списка, который видит модель
# ru/kz/en   — слова для поиска (find_image) и для людей; модель их не получает
# Источник — Fluent Emoji (стиль 3D), MIT, см. LICENSE.md рядом.

