summary = """
Кроссворд, в клетках которого не буквы, а цифры ответов: примеры-вопросы \
идут по горизонтали и вертикали, по одной цифре в клетку. Пересечения \
проверяют сами себя — цифра, не сходящаяся на пересечении, сигналит об ошибке."""
