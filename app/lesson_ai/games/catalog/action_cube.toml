id = "action_cube"
title = "Кубик движений"
family = "movement"
status = "draft"

summary = """
Крупный кубик из развёртки и стопка карточек-заданий: бросил кубик — вытяни \
карточку с этим числом и выполни задание движением — покажи упражнение, \
простучи ритм, пройди как медведь. Класс разбит на круги по 4–6 человек, \
у каждого круга свой набор карточек и свой круговой трек."""
scoring = "Задание выполнено — круг двигает фишку по треку; первый замкнувший круг — победитель, остальные доканчивают свой круг."

subjects = ["physical_culture", "music"]
content_shapes = ["open_response", "short_answer"]
grade_min = 1
grade_max = 4
engagement_levels = ["active", "full_game"]
level_shift = """
На весь урок: круги становятся станциями-испытаниями с паспортом круга, \
за каждый выполненный бросок — печать; финал — общая «эстафета чемпионов»."""
lesson_phases = ["middle", "whole_lesson"]
duration_min = 10
duration_max = 35
grouping = ["small_groups", "teams"]
print_unit = "per_group"
group_size_min = 4
group_size_max = 6
rules_complexity = "simple"
student_reading = "none"
movement = "around_class"
noise = "loud"
competition = "team"
teacher_role = "referee"

self_check = "peer_check"
invariants = [
  "Каждое число грани кубика имеет хотя бы две карточки в стопке: задание не повторяется подряд.",
  "Карточка-движение выполнима в классе без снаряда и травмы: движение в пределах круга, два шага в стороны.",
  "Число на карточке совпадает с числом грани, и ключ круга перечисляет задания по числам.",
  "Название движения проговаривается вслух перед выполнением — на языке предмета.",
]
model_generates = [
  "10–16 карточек-заданий движений под тему урока с числами граней.",
  "Тексты заданий и ключ круга.",
  "Название круга и одну фразу сюжета («тренировка чемпионов»).",
]
pitfalls = [
  "Бег по классу без разметки кругов — столкновения; круги расставить до урока, движение в пределах круга.",
  "«Покажи семь прыжков» для 4 класса — слишком просто: сложность держит способ выполнения, а не число.",
  "Один круг играет, остальные смотрят — кругов по числу команд, у каждого свой трек.",
]
in_class_differentiation = "В стопке круга карточки двух уровней: простое движение и движение с заданием («покажи и назови слово темы»)."
combines_with = ["dice_board", "living_board", "true_false_signals"]
station_ready = true
lang_sensitive = false

props = ["die", "counters"]
server_assets = ["die_net", "tokens", "diploma"]
prep_effort = "medium"
replayability = "reusable_frame"

source = "Дополнение каталога под предметы, 16.10.2026"
export_shape = "none"

[lang_notes]
ru = "Задания на карточках — на языке обучения; название движения проговаривается вслух перед выполнением."
kz = "Названия движений — казахские, с проговариванием вслух: жүгіру, секіру, отыру."

[difficulty_scaling]
basic = "Одно движение на карточку, показ по образцу учителя."
standard = "Движение с заданием («три прыжка и назови слово темы»)."
advanced = "Карточка-«судья»: выполнивший назначает следующего и проверяет; связка движений в мини-комбинацию."

[[print_items]]
name = "Карточки-задания по числам граней"
per = "per_group"
count = "10–16"
