id = "color_by_answer"
title = "Раскрась по ответу"
family = "reveal"
status = "draft"

summary = """
Картинка разбита на области, в каждой — пример; легенда внизу говорит, какой \
штриховкой закрашивается каждый ответ. Правильность проверяет сама картинка: \
ошибся — узор не сходится с образцом. Мотор игры — любопытство «что там нарисовано»."""
scoring = "Очков нет: результат — открывшаяся картинка, сверка с образцом учителя."

