id = "memory_pairs"
title = "Найди пару (мемори)"
family = "matching"
status = "draft"

summary = """
Карточки лежат рубашкой вверх; в свой ход игрок открывает две: нашёл вопрос \
и его ответ (пример и ответ на математике, слово и перевод на языке) — \
забирает пару и ходит снова, нет — переворачивает обратно и передаёт ход. \
Собранные пары пересчитываются вслух — короткая пауза между ходами."""
scoring = "Пара — 1 очко. Побеждает собравший больше пар; партия — 7–10 минут, открыты все карточки."

subjects = ["any"]
content_shapes = ["pairs"]
grade_min = 1
grade_max = 4
engagement_levels = ["calm"]
level_shift = ""
lesson_phases = ["middle"]
duration_min = 7
duration_max = 12
grouping = ["pairs"]
print_unit = "per_pair"
group_size_min = 2
group_size_max = 2
rules_complexity = "simple"
student_reading = "none"
movement = "seated"
noise = "quiet"
competition = "individual"
teacher_role = "observer"

self_check = "answer_key"
invariants = [
  "У каждой карточки ровно одна пара в наборе: два вопроса с одним ответом в наборе не встречаются.",
  "Число карточек чётное, все они складываются в пары без остатка.",
  "Рубашки всех карточек одинаковы: по обороту пару не угадать.",
  "Лист-ключ перечисляет все пары набора и только их.",
]
model_generates = [
  "Пары «вопрос — ответ» под тему урока: примеры на математике, слово и перевод на языке, термин и смысл, герой и поступок.",
  "Лист-ключ с парами.",
  "Название игры и одну фразу сюжета.",
]
pitfalls = [
  "Две карточки с одинаковым ответом дают спорную пару — дети спорят, а не играют.",
  "Больше 12 пар на двоих первоклассников — игра тянется, память устаёт раньше, чем кончается набор.",
  "Просвечивающая бумага выдаёт карточку: рубашка должна быть плотным узором, а не тонкой рамкой.",
]
in_class_differentiation = "Паре посильнее — набор «термин — смысл», послабее — «вопрос — ответ»: рубашки одинаковые."
combines_with = ["math_domino", "station_quest", "story_journey", "flashcards"]
station_ready = true
lang_sensitive = false

props = ["envelopes"]
server_assets = ["tokens", "diploma"]
prep_effort = "medium"
replayability = "replayable"

source = "Картотека L5, 22.09.2026, раздел 2.2"
export_shape = "matching"

[lang_notes]
kz = "Пары «термин — смысл» на advanced — казахскими словами урока, а не переводом с русского."

[difficulty_scaling]
basic = "Простые пары темы: число и карточка с точками, слово и его подпись; 6–8 пар."
standard = "Пары «вопрос — ответ» темы урока, 8–10 пар."
advanced = "Пары посложнее: «равное — равному» на математике, «слово — перевод», «герой — его поступок», «термин — смысл»; 10–12 пар."

