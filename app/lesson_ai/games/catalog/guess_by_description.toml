id = "guess_by_description"
title = "Угадай по описанию"
family = "deduction"
status = "draft"

summary = """
Карточка описания перечисляет три-четыре признака предмета, существа или \
героя, не называя его; игрок закрывает фишкой карточку-отгадку на своём \
поле. Описания читает ведущий вслух или дети про себя — отгадку можно \
закрыть и до конца описания, но рано — значит рискованно."""
scoring = "Отгадка после первого признака — 2 очка, после второго — 1, после третьего — без очка; очки на простом табло."

