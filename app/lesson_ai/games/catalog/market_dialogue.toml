id = "market_dialogue"
title = "Диалог на базаре"
family = "roleplay"
status = "draft"

summary = """
Класс — базар: у части детей карточки-товары, у части — списки покупок и \
«кошельки» с жетонами. Покупатель подходит к продавцу и ведёт диалог по \
опорным репликам: поздороваться, спросить цену, поторговаться, поблагодарить. \
Роли меняются после каждой сделки, товар «продаётся» за верно проведённый \
диалог."""
scoring = "Диалог проведён по опорам без подсказки учителя — сделка состоялась, жетон делится между продавцом и покупателем; лучший диалог урока выбирается аплодисментами."

subjects = ["kazakh_lang_l1", "kazakh_lang_l2", "russian_lang_l1", "russian_lang_l2", "english", "german", "french", "world_around"]
content_shapes = ["open_response"]
grade_min = 1
grade_max = 4
engagement_levels = ["full_game", "active"]
level_shift = """
Один «базарный ряд» из трёх-четырёх продавцов у доски на 10–15 минут, \
остальные покупают по очереди со своих мест — это уже active."""
lesson_phases = ["whole_lesson", "end"]
duration_min = 10
duration_max = 35
grouping = ["pairs", "small_groups"]
print_unit = "per_class"
group_size_min = 2
group_size_max = 6
rules_complexity = "simple"
student_reading = "short"
movement = "around_class"
noise = "loud"
competition = "individual"
teacher_role = "facilitator"

self_check = "teacher_check"
invariants = [
  "Опорные реплики накрывают весь ход диалога: приветствие, вопрос о цене, торг, благодарность — ни одного шага без опоры.",
  "Товары и списки покупок сходятся: любой товар из списка у кого-то продаётся, и цена каждого есть в прайсе.",
  "Реплики написаны на изучаемом языке урока целиком, с переводом на язык обучения мелким шрифтом внизу карточки.",
  "На advanced в опорах есть вежливая форма-ловушка: наугад выбранная реплика выдаёт незнание.",
]
model_generates = [
  "6–10 карточек товаров с ценами на языке предмета.",
  "Опорные реплики диалога по шагам и списки покупок.",
  "Роли (продавец, покупатель, контролёр) и одну фразу сюжета базара.",
]
pitfalls = [
  "Дети читают реплики по бумажке ровным голосом — со второй сделки опоры переворачиваются рубашкой вверх, говорит память.",
  "Без смены ролей один и тот же ребёнок продаёт весь урок — роли меняются после каждой сделки.",
  "Товар без цены или покупка без товара в списке ломают торг — прайс и списки сверяются при подготовке.",
]
in_class_differentiation = "Сильным — торговаться без опоры на два хода, слабым — короткая опора из трёх реплик."
combines_with = ["shop", "story_journey", "character_interview"]
station_ready = false
lang_sensitive = true

props = ["envelopes"]
server_assets = ["money", "tokens", "diploma"]
prep_effort = "medium"
replayability = "reusable_frame"

source = "Дополнение каталога под предметы, 16.10.2026"
export_shape = "none"

[lang_notes]
ru = "Диалог — на изучаемом языке предмета: на казахском и русском — языке обучения, на иностранном — изучаемом."
kz = """
Реплики базара — живые казахские: «Сәлеметсіз бе», «Қанша тұрады?», \
«Арзандатыңыз», «Рахмет». Окончания при склонении (бағасы, бағасын) даются \
в опорах готовыми: первоклассник их не конструирует; сингармонизм вежливых \
форм проверяется по ключу."""

[difficulty_scaling]
basic = "Три шага диалога по опоре: приветствие, «сколько стоит», спасибо; цены круглые."
standard = "Полный диалог с торгом и двумя товарами в списке; опора переворачивается со второй сделки."
advanced = "Диалог без опоры, торг на два хода, «контролёр» слушает и находит ошибку в реплике; вежливые формы обязательны."

