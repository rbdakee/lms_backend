id = "knowledge_auction"
title = "Аукцион знаний"
family = "economy"
status = "draft"

summary = """
Команды зарабатывают жетоны в раундах заданий, а затем тратят их на аукционе: \
лоты — «право первого хода», «роль арбитра», части финального пазла. Ведущий-\
аукционист объявляет лот, команды повышают ставку с шагом; перебил — забирай, \
но на главный лот жетонов может не хватить."""
scoring = "Побеждает команда, собравшая финальный пазл или больше ценных лотов; итог — пересчёт «банка» каждой команды вслух."

subjects = ["any"]
content_shapes = ["short_answer", "multi_step", "money"]
grade_min = 3
grade_max = 4
engagement_levels = ["full_game", "active"]
level_shift = """
Только аукцион в конце урока на 10–15 минут: жетоны заработаны обычной \
работой на уроке, раундов заданий нет. Остаются торги и пересчёт банка."""
lesson_phases = ["whole_lesson", "end"]
duration_min = 10
duration_max = 35
grouping = ["teams"]
print_unit = "per_team"
group_size_min = 4
group_size_max = 6
rules_complexity = "complex"
student_reading = "short"
movement = "seated"
noise = "loud"
competition = "team"
teacher_role = "host"

self_check = "teacher_check"
invariants = [
  "Жетонов, которые можно заработать в раундах, хватает на главный лот, но не на все лоты сразу.",
  "Стартовые цены и шаг торгов набираются жетонами имеющихся достоинств.",
  "Части финального пазла вместе дают одну картинку или слово, и каждая часть — отдельный лот.",
  "На advanced «вклад» возвращает жетоны через раунд — целым числом, без дробей.",
]
model_generates = [
  "Задания раундов и сколько жетонов даёт каждое.",
  "Лоты со стартовой ценой, среди них главный и (на advanced) лот-обманка.",
  "Финальный пазл под тему урока.",
]
pitfalls = [
  "Команда, проигравшая первые раунды, вне игры до конца — нужен лот, доступный и бедной команде.",
  "Торги без шага и без счёта до трёх превращаются в крик — аукционист ведёт строго.",
  "Правила вкладов на basic лишние: там фиксированные цены.",
]
in_class_differentiation = "Задания раундов двух стоимостей: трудное приносит больше жетонов — команда решает, кого на что поставить."
combines_with = ["true_false_signals", "card_duel", "shop", "sea_battle"]
station_ready = false
lang_sensitive = false

props = []
server_assets = ["money", "tokens", "diploma"]
prep_effort = "medium"
replayability = "reusable_frame"

source = "Картотека L5, 22.09.2026, раздел 4.5"
export_shape = "none"

[difficulty_scaling]
basic = "Лоты с фиксированной ценой, жетоны только за верные ответы."
standard = "Торги с шагом и «тайные ставки» в записке."
advanced = "«Вклады»: верно выполненное задание приносит жетоны через раунд; лот-обманка, который ничего не даёт, — надо было не торговаться."

[[print_items]]
name = "Карточки лотов"
per = "per_class"
count = "6–10"
layout = "card_grid"
cut = "grid"
double_sided = false

