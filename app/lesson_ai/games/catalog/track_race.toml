  "Комплекты «по цвету» на чёрно-белом принтере не различить — комплекты помечаются значками: круг, звезда, треугольник, квадрат.",
  "Учитель не успевает проверять шесть команд сразу — ответы на полоске, одна проверка за раз, остальные решают дальше.",
