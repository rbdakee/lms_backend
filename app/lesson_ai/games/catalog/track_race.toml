id = "track_race"
title = "Гонка по трассе"
family = "board_race"
status = "draft"

summary = """
На общей трассе из клеток-этапов у каждой команды своя фишка-машинка. \
Команда решает свой комплект заданий и за каждый верный ответ передвигает \
фишку на клетку вперёд. Дистанция у всех одна, комплекты разные, чтобы не списывать."""
scoring = "Первая у финиша — победила; верность проверяет учитель по ключу, неверный ответ — машинка стоит."

