id = "word_chain"
title = "Цепочка слов"
family = "chain"
status = "draft"

summary = """
Эстафета по ряду: лист-цепочка со стартовым словом идёт от парты к парте; \
каждая пара вписывает слово, начинающееся на последнюю букву предыдущего. \
Вариант за партой: пары молча выкладывают цепочку из карточек-слов на столе — \
кто раньше собрал верную цепочку."""
scoring = "Каждое верное звено — 1 очко; цепочка с ошибкой рвётся на этом звене. Побеждает ряд или пара с самой длинной верной цепочкой."

subjects = ["literacy_ru", "native_language_kz", "kazakh_lang_l1", "kazakh_lang_l2", "russian_lang_l1", "russian_lang_l2", "literary_reading_ru", "literary_reading_kz", "english", "german", "french"]
content_shapes = ["open_response", "ordering"]
grade_min = 1
grade_max = 4
engagement_levels = ["active", "calm"]
level_shift = """
Без гонки по ряду: пары выкладывают цепочку из карточек-слов тихо за партой, \
проверка по ключу в конце — это уже calm."""
lesson_phases = ["middle", "end"]
duration_min = 5
duration_max = 12
grouping = ["teams", "pairs"]
print_unit = "per_team"
group_size_min = 2
group_size_max = 8
rules_complexity = "simple"
student_reading = "short"
movement = "seated"
noise = "voiced"
competition = "team"
teacher_role = "referee"

self_check = "peer_check"
invariants = [
  "Стартовое слово дано на листе, и первое вписанное звено начинается ровно на его последнюю букву.",
  "Слово в цепочке не повторяется: повтор — разрыв, а не продолжение.",
  "Опорные слова держат цепочку в теме урока: звено «из головы» вне темы очка не приносит.",
  "На advanced звено двойное: слово и вопрос или признак к нему — оба засчитываются вместе.",
]
model_generates = [
  "Стартовое слово и 8–12 опорных слов темы урока на языке предмета.",
  "Лист-цепочку с клетками и правилом в одну строку.",
  "Ключ: верные звенья и частые ловушки (слово не на ту букву, повтор).",
]
pitfalls = [
  "Спор «на какую букву кончается слово» съедает игру: правило про мягкий знак и буквы, не бывающие в конце, проговаривается до старта.",
  "Цепочка без опорных слов уходит из темы урока — список слов темы на листе обязателен.",
  "Ряд из двадцати человек ждёт одну парту — цепочку ведут в двух-трёх экземплярах на ряд.",
]
in_class_differentiation = "Слабой паре — лист с первой буквой следующего звена, уже вписанной; сильной — пустой лист."
combines_with = ["flashcards", "build_a_word", "sentence_puzzle"]
station_ready = true
lang_sensitive = true

props = ["pencils"]
server_assets = ["tokens", "diploma"]
prep_effort = "low"
replayability = "replayable"

source = "Дополнение каталога под предметы, 16.10.2026"
export_shape = "none"

[lang_notes]
ru = "Цепочка — на языке предмета: на языках слова изучаемого языка, на чтении — слова текста урока."
kz = """
Слова — казахские, не перевод: последняя буква казахского слова чаще гласная, \
и правило звена на неё и опирается. Буквы ә, ғ, қ, ң, ө, ұ, ү, һ, і пишутся \
полностью. На ана тілі и Т1 на advanced добавить правило сингармонизма: звено \
держит ряд гласных."""

[difficulty_scaling]
basic = "Стартовое слово в 3–4 буквы, звено — просто слово на последнюю букву."
standard = "Цепочка с ограничением темы («только слова про осень»), 10 звеньев."
advanced = "Двойное звено: слово и признак к нему; на ана тіли и Т1 — с проверкой сингармонизма."

[[print_items]]
name = "Лист-цепочка с клетками"
per = "per_team"
count = "1–3 на ряд"
layout = "a4_sheet"
cut = "none"
double_sided = false

[[print_items]]
name = "Карточки-слова для варианта за партой"
per = "per_pair"
count = "20–30"
layout = "card_grid"
cut = "grid"
double_sided = false
