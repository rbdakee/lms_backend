id = "magic_square"
title = "Магический квадрат"
family = "grid_puzzle"
status = "draft"

summary = """
Квадрат из клеток, в котором суммы каждой строки, каждого столбца и обеих \
диагоналей равны. Часть чисел дана, остальные ребёнок восстанавливает, \
рассуждая от строки, где пропуск один."""
scoring = "Очков нет: квадрат, где все суммы сошлись, решён; пара, первой нашедшая все пропуски, — жетон."

