id = "tangram"
title = "Танграм и геометрическая мозаика"
family = "spatial"
status = "draft"

summary = """
Семь фигур, вырезанных из квадрата, складываются по силуэту: зверь, дом, \
корабль. По ходу дети называют и считают фигуры, стороны и углы; усложнение — \
«сложи фигуру площадью 8 клеток»."""
scoring = "Соревнование мягкое: силуэт сложен — жетон, у кого больше силуэтов за время."

subjects = ["any"]
content_shapes = ["spatial", "measurement"]
