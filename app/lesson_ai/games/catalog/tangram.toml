grade_min = 1
grade_max = 4
engagement_levels = ["calm"]
level_shift = ""
lesson_phases = ["middle"]
duration_min = 5
duration_max = 20
grouping = ["individual"]
print_unit = "per_student"
group_size_min = 1
group_size_max = 1
rules_complexity = "simple"
student_reading = "none"
movement = "seated"
noise = "quiet"
competition = "individual"
teacher_role = "observer"

self_check = "self_revealing"
invariants = [
  "Набор — ровно семь классических частей квадрата: два больших треугольника, средний, два малых, квадрат, параллелограмм.",
  "Каждый силуэт складывается из всех семи частей без наложений и дыр.",
  "Силуэт напечатан в том же масштабе, что и части: сложенные части ложатся прямо на карточку.",
  "Вопросы по фигурам (сколько треугольников, какой площади) проверяются по самому набору.",
]
model_generates = [
  "Выбор силуэтов под сюжет урока и подписи к ним.",
  "Вопросы по ходу: назови, посчитай стороны и углы, найди площадь в клетках.",
  "Задание advanced «составь свой силуэт и опиши его».",
]
pitfalls = [
  "Силуэт в другом масштабе, чем части, не собирается — выглядит как ошибка ребёнка.",
  "Резать тонкую бумагу первоклассникам — пол-урока и мятые части; раскрой режет учитель заранее на плотной бумаге.",
  "Придуманный силуэт, который из семи частей не складывается, — только из проверенных силуэтов.",
]
in_class_differentiation = "Слабому — силуэт с внутренними линиями, сильному — только контур: карточки на одной странице."
