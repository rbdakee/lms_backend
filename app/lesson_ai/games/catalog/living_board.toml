source = "Картотека L5, 22.09.2026, раздел 4.6"
export_shape = "none"

[difficulty_scaling]
basic = "Клетки «повтори и назови»: слово, буква, звук или факт темы — одним словом."
standard = "Карточки-задания темы урока вразброс: примеры на математике, слова и фразы на языке, вопросы по предмету."
advanced = "Клетки-испытания: «объясни ответ вслух», «назови три признака предмета», «задай вопрос команде по теме»."

