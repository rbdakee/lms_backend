id = "living_board"
title = "Живая ходилка (гигантское поле)"
family = "board_race"
status = "draft"

summary = """
Поле раскладывается на полу класса листами; фишки — сами дети или команды. \
Бросок — крупным кубиком из развёртки; на клетке — карточка из стопки: команда \
решает шёпотом и даёт один ответ. Роли меняются по кругу: бросающий, счётчик, арбитр."""
scoring = "Верно — ход засчитан, неверно — возврат на прежнюю клетку; финиш открывает «сундук» с грамотами."

subjects = ["any"]
content_shapes = ["short_answer", "measurement", "open_response"]
grade_min = 1
grade_max = 2
engagement_levels = ["full_game"]
level_shift = ""
lesson_phases = ["whole_lesson"]
duration_min = 25
duration_max = 35
grouping = ["teams", "whole_class"]
print_unit = "per_class"
group_size_min = 4
group_size_max = 8
rules_complexity = "simple"
student_reading = "none"
movement = "around_class"
noise = "loud"
competition = "team"
teacher_role = "host"

self_check = "teacher_check"
invariants = [
  "Клеток столько, чтобы команда дошла до финиша за 8–12 бросков: 20–30 листов.",
  "Карточек в стопке хватает на все ходы всех команд без повторов: не меньше 30.",
  "Каждая карточка однозначно проверяется учителем на слух — ответ в одно-два слова.",
]
model_generates = [
  "Карточки-задания для стопки и ответы для учителя.",
  "Тексты клеток-событий и сюжет пути к «сундуку».",
  "Задания клеток-испытаний для advanced.",
]
pitfalls = [
  "Поле посреди класса без сдвинутых парт — дети спотыкаются; в записке учителю: сдвинуть парты до урока.",
  "Листы скользят по полу — закрепить скотчем или раскладывать на ковре.",
  "Одна команда ходит, остальные ждут и шумят: ход короткий, остальные решают ту же карточку «про себя» и показывают ответ пальцами.",
  "Задания на поле, а не в стопке, убивают раму: поле нужно переиспользовать.",
]
in_class_differentiation = "Две стопки карточек — «лёгкая» и «звёздная»: команда выбирает, звёздная даёт лишний шаг."
combines_with = ["dice_board", "math_fishing", "true_false_signals", "story_journey"]
