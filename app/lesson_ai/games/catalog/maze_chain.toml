id = "maze_chain"
title = "Лабиринт-цепочка"
family = "chain"
status = "draft"

summary = """
Поле из клеток с числами; из каждой клетки несколько выходов к соседям. \
Ребёнок идёт от старта туда, где стоит верный ответ примера текущей клетки, \
и доходит до выхода; путь обводит карандашом. Неверный ответ ведёт в тупик."""
scoring = "Очко за каждый верный поворот; дошёл до выхода без тупиков — жетон."

