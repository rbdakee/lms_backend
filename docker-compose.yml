services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: lms
    # 5445 снаружи, чтобы не столкнуться с локальным Postgres на 5432
    ports:
      - "5445:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms"]
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://lms:lms@db:5432/lms
    ports:
      - "8000:8000"
    volumes:
      - .:/code
      # Иначе bind-mount затирает .venv из образа хостовым, собранным под macOS
      - /code/.venv
    command: >
      sh -c "uv run --no-sync alembic upgrade head &&
             uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  db_data:
