# Бой. Локальный запуск — docker-compose.yml, отличия описаны в DEPLOY.md.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Значения берутся из .env рядом с этим файлом — образец в .env.prod.example.

# Своё имя проекта: иначе compose берёт его из имени каталога, и боевой
# стек стал бы тем же самым, что локальный из docker-compose.yml, — с общими
# контейнерами и общим томом базы
name: lms_prod

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Порт наружу не публикуется: до базы ходит только сервис по сети compose
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Миграции — отдельным шагом, а не в команде сервиса: упавшая миграция
  # обязана остановить выкат, а не поднять сервис на половине схемы
  migrate:
    build: .
    restart: "no"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: uv run --no-sync alembic upgrade head

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Порт наружу НЕ публикуется, и это не мелочь: до сервиса не должно быть
    # дороги мимо прокси, иначе X-Real-IP ставит себе кто угодно и потолки
    # SMS и проверки сертификата обходятся одной строчкой в запросе
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Здесь лежат выпущенные сертификаты: без тома каждый перезапуск
      # ходит за новыми, а у Let's Encrypt на это недельный потолок
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  db_data:
  caddy_data:
  caddy_config:
